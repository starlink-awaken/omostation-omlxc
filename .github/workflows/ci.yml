name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # CR-CI-RUNNER-COST: 唯一的 darwin 分支 (dataplane/thermal.py::_probe_darwin) 已由
        # tests/unit/test_thermal_guard.py::test_probe_darwin_parsing 用 mock 覆盖 (不依赖真机),
        # macOS 腿 (10x 单价) 零增量覆盖 —— 删。
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          python-version: "3.13"
      - run: uv sync --all-groups --locked
      - run: uv run pytest -q --memory-guard-capacity-gb=128
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv build
      - name: Smoke generated wheel entry points in an isolated environment
        run: |
          smoke_dir="$RUNNER_TEMP/omlxc-wheel-smoke"
          uv venv --python 3.13 "$smoke_dir"
          shopt -s nullglob
          wheels=(dist/omlxc-*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one omlxc wheel, found ${#wheels[@]}"
            exit 1
          fi
          uv pip install --python "$smoke_dir/bin/python" "${wheels[0]}"
          "$smoke_dir/bin/omlxc" --version
          "$smoke_dir/bin/omlxcd" --help
      - run: uv run pip-audit

  # CR-CI-RUNNER-COST: macOS 10x / Windows 2x 单价 (Linux 1x) —— 未登记即阻塞
  runner-cost:
    name: CR-CI-RUNNER-COST (runner 成本守门)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml
      - name: Scan workflows for paid OS runners
        run: python3 bin/gac/check-runner-cost.py
